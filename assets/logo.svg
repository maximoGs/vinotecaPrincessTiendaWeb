<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y profundidad -->
    <filter id="royalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes de Oro Real -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="25%" stop-color="#e8bf56"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa8012"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>

    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8012"/>
      <stop offset="50%" stop-color="#fdf0cd"/>
      <stop offset="100%" stop-color="#aa8012"/>
    </linearGradient>

    <!-- Gradientes de Fondo Rojo Oscuro / Borgoña Real -->
    <radialGradient id="royalWineRadial" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6e1322"/>
      <stop offset="50%" stop-color="#420a14"/>
      <stop offset="85%" stop-color="#24050b"/>
      <stop offset="100%" stop-color="#140206"/>
    </radialGradient>

    <linearGradient id="wineRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0811"/>
      <stop offset="50%" stop-color="#5a0f1c"/>
      <stop offset="100%" stop-color="#24050b"/>
    </linearGradient>

    <!-- Rutas circulares para el texto arqueado -->
    <path id="textPathTop" d="M 90,250 A 160,160 0 0,1 410,250" fill="none"/>
    <path id="textPathBottom" d="M 410,250 A 160,160 0 0,1 90,250" fill="none"/>
  </defs>

  <!-- Sombra base -->
  <circle cx="250" cy="250" r="236" fill="#140206" filter="url(#royalShadow)"/>

  <!-- Anillo Exterior Dorado Labrado -->
  <circle cx="250" cy="250" r="236" fill="url(#goldMetallic)" stroke="#1a0408" stroke-width="4"/>
  
  <!-- Anillo Intermedio Borgoña / Rojo Oscuro Profundo -->
  <circle cx="250" cy="250" r="202" fill="url(#wineRingGrad)" stroke="url(#goldMetallic)" stroke-width="3"/>
  
  <!-- Anillo Fino Interior Dorado con Patrón de Puntos / Remaches Reales -->
  <circle cx="250" cy="250" r="142" fill="url(#royalWineRadial)" stroke="url(#goldMetallic)" stroke-width="4"/>
  <circle cx="250" cy="250" r="134" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Estrellas / Diamantes Laterales -->
  <g fill="url(#goldMetallic)">
    <!-- Izquierda -->
    <path d="M 85,250 L 91,244 L 97,250 L 91,256 Z"/>
    <circle cx="91" cy="250" r="1.5" fill="#ffffff"/>
    <!-- Derecha -->
    <path d="M 403,250 L 409,244 L 415,250 L 409,256 Z"/>
    <circle cx="409" cy="250" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Texto Superior: VINOTECA -->
  <text fill="url(#goldMetallic)" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="44" letter-spacing="12" filter="url(#goldGlow)">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      VINOTECA
    </textPath>
  </text>

  <!-- Texto Inferior: PRINCESS -->
  <text fill="url(#goldMetallic)" font-family="'Cinzel', 'Georgia', serif" font-weight="900" font-size="44" letter-spacing="14" filter="url(#goldGlow)">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      PRINCESS
    </textPath>
  </text>

  <!-- ========================================================
       EMBLEMA CENTRAL: CORONA REAL DE PRINCESA + COPA & UVAS
       ======================================================== -->
  <g id="princessCrest" transform="translate(250, 246)">
    
    <!-- Resplandor Aureo Central -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(212, 175, 55, 0.15)" stroke-width="2"/>

    <!-- Laureles / Espigas de la Realeza a los lados -->
    <g stroke="url(#goldMetallic)" fill="url(#goldMetallic)" stroke-width="1.2" opacity="0.9">
      <!-- Laurel Izquierdo -->
      <path d="M -58,15 C -65,0 -55,-25 -42,-45 C -44,-30 -48,-10 -40,10" fill="none" stroke-width="2.5"/>
      <ellipse cx="-48" cy="-35" rx="5" ry="11" transform="rotate(-35 -48 -35)"/>
      <ellipse cx="-57" cy="-18" rx="5" ry="11" transform="rotate(-20 -57 -18)"/>
      <ellipse cx="-60" cy="2" rx="5" ry="11" transform="rotate(-5 -60 2)"/>
      <ellipse cx="-52" cy="22" rx="5" ry="10" transform="rotate(15 -52 22)"/>

      <!-- Laurel Derecho -->
      <path d="M 58,15 C 65,0 55,-25 42,-45 C 44,-30 48,-10 40,10" fill="none" stroke-width="2.5"/>
      <ellipse cx="48" cy="-35" rx="5" ry="11" transform="rotate(35 48 -35)"/>
      <ellipse cx="57" cy="-18" rx="5" ry="11" transform="rotate(20 57 -18)"/>
      <ellipse cx="60" cy="2" rx="5" ry="11" transform="rotate(5 60 2)"/>
      <ellipse cx="52" cy="22" rx="5" ry="10" transform="rotate(-15 52 22)"/>
    </g>

    <!-- Corona Imperial / Princess Tiara Superior -->
    <g transform="translate(0, -50)">
      <!-- Base de la corona con gemas -->
      <path d="M -34,16 Q 0,22 34,16 L 36,10 Q 0,16 -36,10 Z" fill="url(#goldMetallic)" stroke="#1a0408" stroke-width="1"/>
      <circle cx="-20" cy="14" r="2.2" fill="#750c1e" stroke="#fff0b8" stroke-width="0.8"/>
      <circle cx="0" cy="17" r="2.8" fill="#750c1e" stroke="#fff0b8" stroke-width="0.8"/>
      <circle cx="20" cy="14" r="2.2" fill="#750c1e" stroke="#fff0b8" stroke-width="0.8"/>

      <!-- Picos de la corona estilo Princesa -->
      <!-- Centro alto -->
      <path d="M -8,12 L 0,-14 L 8,12 Z" fill="url(#goldMetallic)" stroke="#3a0910" stroke-width="1"/>
      <circle cx="0" cy="-16" r="3.5" fill="#fff" stroke="url(#goldMetallic)" stroke-width="1.2"/>
      
      <!-- Picos intermedios -->
      <path d="M -22,11 L -16,-4 L -8,12 Z" fill="url(#goldMetallic)" stroke="#3a0910" stroke-width="1"/>
      <circle cx="-16" cy="-6" r="2.8" fill="#fff" stroke="url(#goldMetallic)" stroke-width="1"/>

      <path d="M 22,11 L 16,-4 L 8,12 Z" fill="url(#goldMetallic)" stroke="#3a0910" stroke-width="1"/>
      <circle cx="16" cy="-6" r="2.8" fill="#fff" stroke="url(#goldMetallic)" stroke-width="1"/>

      <!-- Picos laterales -->
      <path d="M -35,10 L -30,2 L -22,11 Z" fill="url(#goldMetallic)" stroke="#3a0910" stroke-width="1"/>
      <circle cx="-30" cy="0" r="2.2" fill="#fff" stroke="url(#goldMetallic)" stroke-width="1"/>

      <path d="M 35,10 L 30,2 L 22,11 Z" fill="url(#goldMetallic)" stroke="#3a0910" stroke-width="1"/>
      <circle cx="30" cy="0" r="2.2" fill="#fff" stroke="url(#goldMetallic)" stroke-width="1"/>
      
      <!-- Flor de Lis / Joya corazón central -->
      <path d="M 0,-4 Q -5,4 0,9 Q 5,4 0,-4 Z" fill="#9b152b" stroke="url(#goldMetallic)" stroke-width="1"/>
    </g>

    <!-- Copa de Vino Real de Cristal & Vino Tinto -->
    <g transform="translate(0, 15)">
      <!-- Caliz de la Copa -->
      <path d="M -18,-24 C -20,-2 -14,14 0,16 C 14,14 20,-2 18,-24 Z" fill="rgba(20, 2, 6, 0.6)" stroke="url(#goldMetallic)" stroke-width="2.5"/>
      <!-- Nivel de Vino Borgoña en la Copa -->
      <path d="M -15,-8 C -14,6 -8,12 0,13 C 8,12 14,6 15,-8 Q 0,-5 -15,-8 Z" fill="#8c1628" stroke="url(#goldMetallic)" stroke-width="1"/>
      <!-- Brillo en la copa -->
      <path d="M -12,-20 C -14,-10 -10,0 -4,10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Tallo de la Copa -->
      <line x1="0" y1="16" x2="0" y2="40" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round"/>
      <!-- Nudo del tallo -->
      <ellipse cx="0" cy="26" rx="3.5" ry="2" fill="url(#goldMetallic)"/>

      <!-- Base de la Copa -->
      <path d="M -18,44 Q 0,40 18,44 L 16,47 Q 0,44 -16,47 Z" fill="url(#goldMetallic)" stroke="#1a0408" stroke-width="0.8"/>
    </g>

    <!-- Racimo de Uvas de Oro a los lados del pie de la copa -->
    <g fill="url(#goldMetallic)" stroke="#2b050d" stroke-width="0.8" transform="translate(0, 48)">
      <circle cx="-10" cy="3" r="3.2"/>
      <circle cx="-4" cy="4" r="3.2"/>
      <circle cx="4" cy="4" r="3.2"/>
      <circle cx="10" cy="3" r="3.2"/>
      <circle cx="-7" cy="9" r="2.8"/>
      <circle cx="0" cy="10" r="3"/>
      <circle cx="7" cy="9" r="2.8"/>
      <circle cx="-3.5" cy="15" r="2.4"/>
      <circle cx="3.5" cy="15" r="2.4"/>
      <circle cx="0" cy="20" r="2"/>
    </g>

  </g>
</svg>
